<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Model 2 Mini 3D Inspection Viewer</title>
  <style>
    body { margin: 0; overflow: hidden; background: #1a1c22; }
    canvas { width: 100vw; height: 100vh; display: block; }
    #info {
      position: absolute; top: 10px; left: 10px;
      color: #fff; font-family: monospace; font-size: 14px;
      background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="info">Loading model-2-mini.glb...</div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1c22);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(5, 5, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    window.__renderer = renderer;
    window.__scene = scene;
    window.__camera = camera;
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Lights
    const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 1.5);
    dir.position.set(10, 20, 10);
    scene.add(dir);
    const dir2 = new THREE.DirectionalLight(0xffeedd, 0.8);
    dir2.position.set(-10, 10, -10);
    scene.add(dir2);

    // Grid helper
    const grid = new THREE.GridHelper(20, 20, 0xffaa00, 0x444444);
    scene.add(grid);

    let loadedModel = null;
    let modelBox = null;
    let modelCenter = new THREE.Vector3();
    let modelSize = new THREE.Vector3();

    const loader = new GLTFLoader();
    loader.setMeshoptDecoder(MeshoptDecoder);
    loader.load('/model-2-mini.glb', (gltf) => {
      loadedModel = gltf.scene;
      scene.add(loadedModel);

      // Compute bounding box
      modelBox = new THREE.Box3().setFromObject(loadedModel);
      modelBox.getCenter(modelCenter);
      modelBox.getSize(modelSize);

      // Center model
      loadedModel.position.x = -modelCenter.x;
      loadedModel.position.y = -modelBox.min.y;
      loadedModel.position.z = -modelCenter.z;

      const maxDim = Math.max(modelSize.x, modelSize.y, modelSize.z);
      camera.position.set(maxDim * 1.5, maxDim * 1.0, maxDim * 1.5);
      controls.target.set(0, modelSize.y * 0.5, 0);
      controls.update();

      document.getElementById('info').innerHTML = `Loaded model-2-mini.glb<br>Size: ${modelSize.x.toFixed(2)} x ${modelSize.y.toFixed(2)} x ${modelSize.z.toFixed(2)}<br>Ready!`;
      window.__modelLoaded = true;
      window.__modelInfo = {
        size: { x: modelSize.x, y: modelSize.y, z: modelSize.z },
        meshCount: gltf.scene.children.length
      };
    }, undefined, (err) => {
      document.getElementById('info').innerText = 'Error: ' + err.message;
      window.__modelError = err.message;
    });

    window.setCameraView = function(view) {
      if (!modelSize) return;
      const maxDim = Math.max(modelSize.x, modelSize.y, modelSize.z);
      const targetY = modelSize.y * 0.45;
      controls.target.set(0, targetY, 0);

      if (view === 'corner') {
        camera.position.set(maxDim * 1.2, maxDim * 0.8, maxDim * 1.2);
      } else if (view === 'front-right') {
        camera.position.set(maxDim * 1.5, maxDim * 0.6, maxDim * 0.4);
      } else if (view === 'front-left') {
        camera.position.set(maxDim * 0.4, maxDim * 0.6, maxDim * 1.5);
      } else if (view === 'entrance-zoom') {
        camera.position.set(maxDim * 0.6, maxDim * 0.4, maxDim * 0.6);
        controls.target.set(0, modelSize.y * 0.3, 0);
      } else if (view === 'top') {
        camera.position.set(0.01, maxDim * 2.2, 0);
      }
      controls.update();
    };

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
